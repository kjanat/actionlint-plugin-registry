[tools]
"github:oven-sh/bun"                      = { prefix = "1.4", version_prefix = "bun-v" }
"github:kjanat/dprint"                    = "latest"
"github:kjanat/runner"                    = "latest"
"github:kjanat/shellcheck-rs"             = { version = "latest", rename_exe = "shellcheck" }
"go:actionlint.kjanat.dev/cmd/actionlint" = { version = "fuck-it", auto_update = true, depends = ["go", "github:kjanat/shellcheck-rs"] }

[wrappers]
[wrappers.wrangler]
command = "run"
args    = ["wrangler"]
env     = { RUNNER_DIR = "worker" }

[wrappers.biome]
command = "run"
args    = ["biome"]
env     = { RUNNER_DIR = "worker" }

[tasks.setup]
description = "Install project dependencies."
dir         = "worker"
run         = "bun install --frozen-lockfile"

[tasks.check]
description = "Run project checks."
depends     = ["test:go", "lint:go", "test:python", "check:worker"]

[tasks."test:go"]
run = "go test ./internal/registry ./internal/validation ./cmd/registry"

[tasks."lint:go"]
run = "golangci-lint run --allow-parallel-runners"

[tasks."test:python"]
run = 'python -B -m unittest discover -s scripts -p "test_*.py"'

[tasks."check:worker"]
dir = "worker"
run = ["bun run lint", "bun run typecheck", "bun test", "bun run check:bundle"]
