[tools]
node                                      = "26.12.1"
bun                                       = "latest"
"github:kjanat/dprint"                    = "latest"
"github:kjanat/runner"                    = "latest"
"github:kjanat/shellcheck-rs"             = { version = "latest", rename_exe = "shellcheck" }
"go:actionlint.kjanat.dev/cmd/actionlint" = { version = "fuck-it", auto_update = true, depends = ["go", "github:kjanat/shellcheck-rs"] }

[settings]
idiomatic_version_file_enable_tools            = ["node", "bun", "go"]
idiomatic_version_file_ignore_minimum_versions = true

[wrappers]
[wrappers.wrangler]
command = "run"
args    = ["wrangler"]
env     = { RUNNER_DIR = "worker" }

[wrappers.biome]
command = "run"
args    = ["biome"]
env     = { RUNNER_DIR = "worker" }

[tasks.setup]
description = "Install project dependencies."
run         = [
  "bun install --frozen-lockfile",
  "bun install --cwd worker --frozen-lockfile",
  "bun install --cwd site --frozen-lockfile",
  "bun run --cwd site browser:install",
]

[tasks.check]
description = "Run project checks."
depends     = ["test:go", "lint:go", "check:adapter", "check:cli", "check:worker", "check:site"]

[tasks."test:go"]
run = "go test ./..."

[tasks."lint:go"]
run = "golangci-lint run --allow-parallel-runners"

[tasks."check:adapter"]
dir = "adapters/actionlint"
run = ["go test ./...", "golangci-lint run --allow-parallel-runners"]

[tasks."check:cli"]
run = ["bun run typecheck", "bun run test"]

[tasks."setup:site-browser"]
description = "Install Chromium for catalogue browser tests."
dir = "site"
run = "bun run browser:install"

[tasks."test:site"]
dir = "site"
run = ["bun test", "bun run test:browser"]

[tasks."check:site"]
dir = "site"
run = ["bun run typecheck", "bun test", "bun run test:browser"]

[tasks."build:site"]
description = "Export registry JSON and build the catalogue site."
run = ["go run ./cmd/registry export --store registry/plugins --output dist", "bun site/cli.ts --input dist --output dist"]

[tasks."check:worker"]
dir = "worker"
run = ["bun run lint", "bun run typecheck", "bun test", "bun run check:bundle", "bun run test:runtime"]

[tasks."deploy:worker"]
description = "Check and deploy the registry Worker to Cloudflare."
depends     = ["check:worker"]
dir         = "worker"
run         = "bun run deploy"

[tasks.modernize]
run = "go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest -fix ./..."
