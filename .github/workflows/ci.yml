name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
cache-mode: none

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test registry
        run: go test ./...
      - name: Install pinned Go linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint registry
        run: golangci-lint run --allow-parallel-runners
      - name: Test submission action
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.3
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check Worker types
        run: bun run typecheck
      - name: Test identity and queue policy
        run: bun test
      - name: Validate Worker deployment bundle
        run: bun run check:bundle
