name: Test

on:
  push: { branches: [master] }
  pull_request:

permissions: { contents: read }
cache-mode: none

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: false }
      - name: Test registry
        run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with: { version-file: "${{ github.workspace }}/.tool-versions", skip-cache: true }
      - name: Test submission action
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: adapters/actionlint } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: adapters/actionlint/go.mod, cache: false }
      - name: Test actionlint checker
        run: go test ./...
      - name: Lint actionlint checker
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with: { version-file: "../../.tool-versions", working-directory: adapters/actionlint, skip-cache: true }

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version-file: ".tool-versions", no-cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "26.12.1" }
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint Worker
        run: bun run lint
      - name: Check Worker types
        run: bun run typecheck
      - name: Test identity and queue policy
        run: bun test
      - name: Validate Worker deployment bundle
        run: bun run check:bundle
      - name: Test dispatch and redirect rejection in workerd
        run: bun run test:runtime
